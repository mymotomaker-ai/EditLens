name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: EditLens version
      description: Run /plugin in Claude Code to see it.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      placeholder: "2.1.310"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Your app
      description: For example Vite + React, Next.js, Express, or plain HTML.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /editlens
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the end of ~/.claude/editlens/server-4317.log and ~/.claude/editlens/hooks.log. Remove anything private first.
      render: text
