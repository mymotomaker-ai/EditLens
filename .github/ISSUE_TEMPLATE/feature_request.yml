name: Feature request
description: Suggest a new feature or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the task, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested change
  - type: textarea
    id: other
    attributes:
      label: Other options you tried
